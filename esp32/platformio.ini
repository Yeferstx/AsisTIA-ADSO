[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<prueba_sensores.cpp> -<prueba_rele.cpp>
lib_deps =
    knolleary/PubSubClient
    madhephaestus/ESP32Servo
    marcoschwartz/LiquidCrystal_I2C
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; programa aparte para probar los sensores: pio run -e prueba -t upload
[env:prueba]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<prueba_sensores.cpp>
; usa la libreria de la LCD que ya descargo el programa principal
lib_extra_dirs = .pio/libdeps/esp32dev

; programa aparte para probar el rele: pio run -e rele -t upload
[env:rele]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<prueba_rele.cpp>
lib_extra_dirs = .pio/libdeps/esp32dev
